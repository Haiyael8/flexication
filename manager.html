<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024">
  <title>Flexication - Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header" id="app-header"><a class="brand" href="index.html">Flexication</a></header>
  <main>
    <div id="status" class="message" role="status" aria-live="polite"></div>
    <section class="card" id="content" hidden>
      <h1>Requests pending approval</h1>
      <p class="small">Only requests addressed to you, in a window that has not ended.</p>
      <div id="msg" class="message" role="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Requester</th>
              <th scope="col">Submitted</th>
              <th scope="col">Approval due</th>
              <th scope="col" class="num">Days</th>
              <th scope="col">Request type</th>
              <th scope="col">Decision</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden>No requests are waiting for your approval.</p>
    </section>
  </main>
  <script type="module" src="js/pages/manager.js"></script>
</body>
</html>
